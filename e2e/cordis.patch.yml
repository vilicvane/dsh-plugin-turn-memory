# Overlay for the dedicated ~/.dsh/profiles/test-turn-memory profile.
- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: minimal
        includeUserRoot: false

- id: turn-memory
  config:
    enabled: true
    e2eSmoke: true
    e2eInterruptAfterFirstMutation: true
    e2eDeferTurnCompressionUntilResume: true
    turnWorkerAttempts: 1
    turnContinuation:
      reminderIntervalNodes: 2
    previewChars: 120
    maxReadChars: 30000

- id: test-runner
  disabled: true

- insert:
    - id: turn-memory-e2e-runner
      name: dsh-plugin-turn-memory/e2e-runner
