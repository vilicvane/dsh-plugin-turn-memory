- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: minimal
        includeUserRoot: false

- id: compaction-basic
  disabled: true

- id: turn-memory
  config:
    enabled: true
    turnCompression: false
    sessionCompaction:
      enabled: true
      auto: false
      segmentTokens: 1000
      workerAttempts: 1
      workerMaxTokens: 8192
      workerTimeoutMs: 300000
      e2eInterruptSessionAfterFirstMutation: true

- id: test-runner
  disabled: true

- insert:
    - id: turn-memory-session-compaction-e2e-runner
      name: dsh-plugin-turn-memory/session-compaction-e2e-runner
